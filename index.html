<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infoaula Semanal do Seminário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --ink:#1C2541;
    --black:#14141A;
    --gold:#C9A24B;
    --gold-dim:#E4CE97;
    --cream:#F7F3E9;
    --sand:#EDE6D6;
    --white:#FFFFFF;
    --muted:#6B6F7A;
    --line:#DED4BE;
    --sim:#2F6B4F;
    --nao:#8A8F99;
    --radius:10px;
  }
  html{
    overflow-x:hidden;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    overflow-x:hidden;
    font-family:'Inter',sans-serif;
    background:linear-gradient(180deg,#EFECE3,#E4E0D3);
    color:var(--ink);
    padding:24px 14px 80px;
  }
  .app{
    max-width:1180px;
    margin:0 auto;
  }
  .app-header{
    text-align:center;
    margin-bottom:28px;
  }
  .app-header img{
    width:56px;
    height:auto;
    margin-bottom:8px;
  }
  .app-header h1{
    font-family:'Lora',serif;
    font-weight:700;
    font-size:1.6rem;
    margin:0 0 4px;
    color:var(--ink);
  }
  .app-header p{
    margin:0;
    color:var(--muted);
    font-size:0.92rem;
  }
  .layout{
    display:grid;
    grid-template-columns:minmax(280px,440px) 1fr;
    gap:26px;
    align-items:start;
  }
  @media (max-width:920px){
    .layout{grid-template-columns:1fr;}
  }

  /* ---------- FORM ---------- */
  .form-panel{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px;
  }
  .field-group{
    margin-bottom:16px;
  }
  .field-group label{
    display:block;
    font-size:0.78rem;
    font-weight:600;
    color:var(--ink);
    margin-bottom:5px;
  }
  .field-group input[type=text],
  .field-group textarea,
  .field-group select{
    width:100%;
    padding:9px 10px;
    border:1px solid #D6D2C7;
    border-radius:7px;
    font-family:'Inter',sans-serif;
    font-size:0.86rem;
    color:var(--ink);
    background:#FCFBF8;
  }
  .field-group textarea{
    resize:vertical;
    min-height:56px;
    line-height:1.4;
  }
  .field-group input:focus,
  .field-group textarea:focus,
  .field-group select:focus{
    outline:2px solid var(--gold);
    outline-offset:1px;
    background:#fff;
  }
  .two-col{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .agenda-fields-grid{
    display:block;
  }
  hr.sep{
    border:none;
    border-top:1px solid var(--line);
    margin:18px 0;
  }

  .tabs{
    display:flex;
    gap:6px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .tab-btn{
    flex:1;
    min-width:70px;
    padding:9px 6px;
    border:1px solid var(--line);
    background:var(--cream);
    border-radius:7px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:0.8rem;
    color:var(--ink);
    cursor:pointer;
  }
  .tab-btn.active{
    background:var(--ink);
    color:var(--white);
    border-color:var(--ink);
  }
  .day-panel{display:none;}
  .day-panel.active{display:block;}

  .sem-aula-row{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--sand);
    padding:9px 10px;
    border-radius:7px;
    margin-bottom:14px;
  }
  .sem-aula-row label{
    margin:0;
    font-size:0.82rem;
    font-weight:600;
  }
  .agenda-title{
    font-family:'Lora',serif;
    font-weight:600;
    font-size:0.95rem;
    color:var(--ink);
    margin:18px 0 10px;
    padding-bottom:5px;
    border-bottom:2px solid var(--gold);
  }
  .disabled-fields{opacity:0.4; pointer-events:none;}

  .generate-btn{
    width:100%;
    padding:13px;
    background:var(--ink);
    color:var(--white);
    border:none;
    border-radius:7px;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:0.95rem;
    cursor:pointer;
    margin-top:6px;
  }
  .generate-btn:hover{background:#25335C;}

  /* ---------- PREVIEW / POSTER ---------- */
  .preview-wrap{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
  }
  .preview-label{
    font-size:0.78rem;
    font-weight:600;
    color:var(--muted);
    margin:0 0 10px;
    text-transform:uppercase;
    letter-spacing:0.04em;
  }
  .preview-scroll{
    overflow-x:auto;
    padding-bottom:6px;
  }

  #poster{
    width:840px;
    background:var(--cream);
    font-family:'Inter',sans-serif;
    color:var(--ink);
  }
  .poster-head{
    background:var(--ink);
    color:var(--white);
    padding:30px 34px 26px;
    text-align:center;
    position:relative;
  }
  .poster-head .rays{
    width:46px;
    height:auto;
    margin-bottom:10px;
    filter:invert(1);
  }
  .poster-head h1{
    font-family:'Lora',serif;
    font-weight:700;
    font-size:1.5rem;
    margin:0 0 6px;
    letter-spacing:0.01em;
  }
  .poster-head .sub1{
    font-size:0.86rem;
    color:var(--gold-dim);
    margin:0 0 2px;
    font-weight:600;
  }
  .poster-head .sub2{
    font-size:0.76rem;
    color:#C7CBDA;
    margin:0;
  }
  .poster-week{
    background:var(--gold);
    color:var(--black);
    text-align:center;
    padding:9px 10px;
    font-weight:700;
    font-size:0.88rem;
    letter-spacing:0.02em;
  }

  .day-block{
    padding:22px 30px 6px;
    border-bottom:1px solid var(--line);
  }
  .day-block:last-of-type{border-bottom:none;}
  .day-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .day-head .day-name{
    font-family:'Lora',serif;
    font-weight:700;
    font-size:1.15rem;
    color:var(--ink);
  }
  .day-head .day-name span{
    color:var(--gold);
    font-weight:700;
  }
  .atividade-pill{
    font-size:0.72rem;
    font-weight:700;
    padding:4px 11px;
    border-radius:20px;
    color:var(--white);
    white-space:nowrap;
  }
  .pill-sim{background:var(--sim);}
  .pill-nao{background:var(--nao);}

  .sem-aula-banner{
    background:var(--sand);
    border:1px dashed #C9BFA3;
    border-radius:8px;
    padding:14px;
    text-align:center;
    color:var(--muted);
    font-style:italic;
    font-size:0.85rem;
    margin-bottom:18px;
  }

  .lesson-box{
    background:var(--white);
    border:1px solid var(--line);
    border-left:4px solid var(--gold);
    border-radius:6px;
    padding:12px 14px;
    margin-bottom:12px;
  }
  .lesson-box .k{
    font-size:0.68rem;
    font-weight:700;
    color:var(--gold);
    letter-spacing:0.03em;
    margin-bottom:3px;
  }
  .lesson-box .v{
    font-size:0.86rem;
    line-height:1.45;
    color:var(--ink);
    white-space:pre-wrap;
  }

  .agenda-label{
    font-family:'Lora',serif;
    font-weight:600;
    font-size:0.82rem;
    color:var(--ink);
    margin:16px 0 8px;
    padding-left:10px;
    border-left:3px solid var(--gold);
  }
  .agenda-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0 18px;
    margin-bottom:6px;
  }
  .agenda-item{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:6px 0;
    border-bottom:1px solid #EEE7D5;
    font-size:0.8rem;
  }
  .agenda-item .lbl{
    color:var(--muted);
    flex-shrink:0;
  }
  .agenda-item .val{
    text-align:right;
    font-weight:600;
    color:var(--ink);
  }
  .agenda-item.full{
    grid-column:1 / -1;
  }
  .agenda-item.full .val{
    text-align:left;
    font-weight:500;
    white-space:pre-wrap;
  }

  .agenda-num-list{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0 22px;
    margin-bottom:4px;
  }
  .agenda-num-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 0;
    border-bottom:1px solid #EEE7D5;
  }
  .agenda-num-item .num-badge{
    flex:0 0 26px;
    width:26px;
    height:26px;
    border-radius:50%;
    background:var(--gold);
    color:var(--black);
    font-weight:800;
    font-size:0.8rem;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .agenda-num-item .content{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:2px;
    min-width:0;
  }
  .agenda-num-item .content .lbl{
    font-size:0.78rem;
    color:var(--muted);
    font-weight:600;
  }
  .agenda-num-item .content .val{
    font-size:0.86rem;
    font-weight:700;
    color:var(--ink);
    text-align:left;
    word-break:break-word;
  }

  .agenda-label-info{
    margin-top:18px;
  }
  .lesson-box-info{
    border-left-color:#9AA6C7;
  }

  .poster-footer{
    text-align:center;
    padding:16px 20px 24px;
    font-size:0.7rem;
    color:var(--muted);
  }

  .actions{
    display:flex;
    gap:10px;
    margin-top:16px;
    flex-wrap:wrap;
  }
  .actions button{
    flex:1;
    min-width:150px;
    padding:12px;
    border-radius:7px;
    font-weight:700;
    font-size:0.88rem;
    cursor:pointer;
    border:none;
  }
  #generateBtn{background:var(--ink); color:var(--white);}
  #downloadBtn{background:var(--gold); color:var(--black);}
  #shareBtn{background:var(--sim); color:var(--white);}
  .hint{
    font-size:0.76rem;
    color:var(--muted);
    margin-top:10px;
    text-align:center;
  }

  /* ---------- RESPONSIVO / CELULAR ---------- */
  @media (max-width:600px){
    body{
      padding:16px 10px 60px;
    }
    .app-header{
      margin-bottom:20px;
    }
    .app-header img{
      width:44px;
    }
    .app-header h1{
      font-size:1.25rem;
    }
    .app-header p{
      font-size:0.82rem;
    }
    .form-panel,
    .preview-wrap{
      padding:14px;
    }
    .two-col{
      grid-template-columns:1fr;
      gap:12px;
    }
    .tabs{
      gap:5px;
    }
    .tab-btn{
      min-width:0;
      padding:9px 4px;
      font-size:0.74rem;
    }
    .actions{
      flex-direction:column;
    }
    .actions button{
      min-width:100%;
      width:100%;
    }
    .field-group input[type=text],
    .field-group textarea,
    .field-group select{
      font-size:0.92rem;
    }
  }
</style>

</head>

<script>
const DAYS = [
  {key:'terca',   name:'Terça',   num:'1'},
  {key:'quarta',  name:'Quarta',  num:'2'},
  {key:'quinta',  name:'Quinta',  num:'3'},
  {key:'sexta',   name:'Sexta',   num:'4'}
];

// Sequência numerada da agenda da aula (a ordem em que as partes acontecem)
const AGENDA_NUMBERED = [
  {key:'boasVindas', label:'Boas Vindas'},
  {key:'regente', label:'Regente'},
  {key:'pianista', label:'Pianista'},
  {key:'hinoAbertura', label:'Hino de Abertura'},
  {key:'oracaoAbertura', label:'Oração de Abertura'},
  {key:'pensamento', label:'Pensamento'},
  {key:'dominioDoutrinario', label:'Domínio Doutrinário'},
  {key:'relembrarAula', label:'Relembrar Aula Passada'},
  {key:'alunoLicao', label:'Aluno (parte da aula)'},
  {key:'professor', label:'Professor'},
  {key:'oracaoEncerramento', label:'Oração de Encerramento'}
];

// Itens informativos da agenda — não fazem parte da sequência numerada
const AGENDA_INFO = [
  {key:'escrituraDominio', label:'Escritura do Domínio Doutrinário', textarea:false},
  {key:'temaLicaoAluno', label:'Tema da Lição do Aluno', textarea:true}
];

const AGENDA_FIELDS = AGENDA_NUMBERED.concat(AGENDA_INFO);

// All fields start empty — the person fills everything in themselves
const EMPTY_DAY = {
  semAula:false,
  temaLicao:'', numeroLicao:'', designacaoEstudo:'', proposito:'', tipoLicao:'', tarefas:'',
  boasVindas:'', regente:'', pianista:'', hinoAbertura:'', oracaoAbertura:'',
  pensamento:'', dominioDoutrinario:'', escrituraDominio:'', relembrarAula:'',
  alunoLicao:'', temaLicaoAluno:'', professor:'', oracaoEncerramento:'',
  atividade:''
};
const DEFAULT_DATA = {
  terca:  Object.assign({}, EMPTY_DAY),
  quarta: Object.assign({}, EMPTY_DAY),
  quinta: Object.assign({}, EMPTY_DAY),
  sexta:  Object.assign({}, EMPTY_DAY)
};

function fieldId(dayKey, field){ return dayKey + '_' + field; }

function buildTabs(){
  const tabsEl = document.getElementById('tabs');
  DAYS.forEach((d,i)=>{
    const btn = document.createElement('button');
    btn.type='button';
    btn.className='tab-btn' + (i===0 ? ' active':'');
    btn.textContent = d.name;
    btn.dataset.day = d.key;
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.day-panel').forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel_'+d.key).classList.add('active');
    });
    tabsEl.appendChild(btn);
  });
}

function buildDayForm(day){
  const data = DEFAULT_DATA[day.key];
  const panel = document.createElement('div');
  panel.className = 'day-panel' + (day.key==='terca' ? ' active':'');
  panel.id = 'panel_'+day.key;

  panel.innerHTML = `
    <div class="sem-aula-row">
      <input type="checkbox" id="${fieldId(day.key,'semAula')}" ${data.semAula ? 'checked':''}>
      <label for="${fieldId(day.key,'semAula')}">${day.name}-feira sem aula</label>
    </div>

    <div class="fields-container ${data.semAula ? 'disabled-fields':''}" id="container_${day.key}">
      <div class="field-group">
        <label>Tema da Lição</label>
        <input type="text" id="${fieldId(day.key,'temaLicao')}" value="${(data.temaLicao||'').replace(/"/g,'&quot;')}">
      </div>
      <div class="field-group">
        <label>Número da Lição</label>
        <input type="text" id="${fieldId(day.key,'numeroLicao')}" value="${(data.numeroLicao||'').replace(/"/g,'&quot;')}">
      </div>
      <div class="field-group">
        <label>Propósito da Lição</label>
        <textarea id="${fieldId(day.key,'proposito')}">${data.proposito||''}</textarea>
      </div>
      <div class="field-group">
        <label>Tipo de Lição</label>
        <select id="${fieldId(day.key,'tipoLicao')}">
          <option value="" ${!data.tipoLicao?'selected':''}>Selecione</option>
          <option value="Lição das Escrituras" ${data.tipoLicao==='Lição das Escrituras'?'selected':''}>Lição das Escrituras</option>
          <option value="Lição de prática de domínio doutrinário" ${data.tipoLicao==='Lição de prática de domínio doutrinário'?'selected':''}>Lição de prática de domínio doutrinário</option>
          <option value="Lição de avaliação de aprendizado" ${data.tipoLicao==='Lição de avaliação de aprendizado'?'selected':''}>Lição de avaliação de aprendizado</option>
          <option value="Lição de preparação para a vida" ${data.tipoLicao==='Lição de preparação para a vida'?'selected':''}>Lição de preparação para a vida</option>
        </select>
      </div>
      <div class="field-group">
        <label>Designação de Estudo</label>
        <textarea id="${fieldId(day.key,'designacaoEstudo')}">${data.designacaoEstudo||''}</textarea>
      </div>
      <div class="field-group">
        <label>Tarefas dos Alunos</label>
        <textarea id="${fieldId(day.key,'tarefas')}">${data.tarefas||''}</textarea>
      </div>

      <div class="agenda-title">Agenda da Aula (sequência)</div>

      <div class="agenda-fields-grid">
        ${AGENDA_NUMBERED.map((f,i)=>`
          <div class="field-group">
            <label>${i+1}. ${f.label}</label>
            <input type="text" id="${fieldId(day.key,f.key)}" value="${(data[f.key]||'').replace(/"/g,'&quot;')}">
          </div>
        `).join('')}
      </div>

      <div class="agenda-title">Informações da Agenda</div>

      ${AGENDA_INFO.map(f=>`
        <div class="field-group">
          <label>${f.label}</label>
          ${f.textarea
            ? `<textarea id="${fieldId(day.key,f.key)}">${data[f.key]||''}</textarea>`
            : `<input type="text" id="${fieldId(day.key,f.key)}" value="${(data[f.key]||'').replace(/"/g,'&quot;')}">`
          }
        </div>
      `).join('')}

      <div class="field-group">
        <label>Atividade</label>
        <select id="${fieldId(day.key,'atividade')}">
          <option value="" ${!data.atividade?'selected':''}>Selecione</option>
          <option value="Não" ${data.atividade==='Não'?'selected':''}>Não</option>
          <option value="Sim" ${data.atividade==='Sim'?'selected':''}>Sim</option>
        </select>
      </div>
    </div>
  `;
  return panel;
}

function collectDayData(day){
  const semAula = document.getElementById(fieldId(day.key,'semAula')).checked;
  const out = { semAula };
  if(!semAula){
    out.temaLicao = document.getElementById(fieldId(day.key,'temaLicao')).value;
    out.numeroLicao = document.getElementById(fieldId(day.key,'numeroLicao')).value;
    out.proposito = document.getElementById(fieldId(day.key,'proposito')).value;
    out.tipoLicao = document.getElementById(fieldId(day.key,'tipoLicao')).value;
    out.designacaoEstudo = document.getElementById(fieldId(day.key,'designacaoEstudo')).value;
    out.tarefas = document.getElementById(fieldId(day.key,'tarefas')).value;
    AGENDA_FIELDS.forEach(f=>{
      out[f.key] = document.getElementById(fieldId(day.key,f.key)).value;
    });
    out.atividade = document.getElementById(fieldId(day.key,'atividade')).value;
  }
  return out;
}

const MONTH_NAMES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

function formatWeekRange(startVal, endVal){
  const parse = (v)=> v ? new Date(v+'T00:00:00') : null;
  const start = parse(startVal);
  const end = parse(endVal);
  const fmtFull = (d)=> `${d.getDate()} de ${MONTH_NAMES[d.getMonth()]} de ${d.getFullYear()}`;

  if(!start && !end) return '';
  if(start && !end) return fmtFull(start);
  if(!start && end) return fmtFull(end);

  if(start.getFullYear()===end.getFullYear() && start.getMonth()===end.getMonth()){
    return `${start.getDate()} a ${end.getDate()} de ${MONTH_NAMES[end.getMonth()]} de ${end.getFullYear()}`;
  }
  if(start.getFullYear()===end.getFullYear()){
    return `${start.getDate()} de ${MONTH_NAMES[start.getMonth()]} a ${end.getDate()} de ${MONTH_NAMES[end.getMonth()]} de ${end.getFullYear()}`;
  }
  return `${fmtFull(start)} a ${fmtFull(end)}`;
}

function collectAll(){
  return {
    tituloClasse: document.getElementById('tituloClasse').value,
    tituloEstaca: document.getElementById('tituloEstaca').value,
    semanaPeriodo: formatWeekRange(
      document.getElementById('semanaInicio').value,
      document.getElementById('semanaFim').value
    ),
    days: DAYS.map(d=>({ meta:d, data:collectDayData(d) }))
  };
}

function esc(str){
  if(!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderAgendaItem(label, value, full){
  return `<div class="agenda-item ${full?'full':''}">
    <span class="lbl">${esc(label)}</span>
    <span class="val">${esc(value) || '—'}</span>
  </div>`;
}

function renderNumberedItem(num, label, value){
  return `<div class="agenda-num-item">
    <span class="num-badge">${num}</span>
    <span class="content">
      <span class="lbl">${esc(label)}</span>
      <span class="val">${esc(value) || '—'}</span>
    </span>
  </div>`;
}

function renderInfoItem(label, value){
  return `<div class="lesson-box lesson-box-info">
    <div class="k">${esc(label)}</div>
    <div class="v">${esc(value) || '—'}</div>
  </div>`;
}

function renderPoster(state){
  const poster = document.getElementById('poster');

  let daysHtml = '';
  state.days.forEach(({meta, data})=>{
    if(data.semAula){
      daysHtml += `
        <div class="day-block">
          <div class="day-head">
            <div class="day-name">${meta.name}<span>-feira ${meta.num}</span></div>
          </div>
          <div class="sem-aula-banner">Sem aula neste dia</div>
        </div>`;
      return;
    }

    const pillClass = data.atividade === 'Sim' ? 'pill-sim' : 'pill-nao';
    const pillText = data.atividade === 'Sim' ? 'Atividade: Sim'
      : data.atividade === 'Não' ? 'Atividade: Não' : 'Atividade: —';

    const agendaNumbered = AGENDA_NUMBERED
      .map((f,i)=>renderNumberedItem(i+1, f.label, data[f.key])).join('');
    const agendaInfo = AGENDA_INFO
      .map(f=>renderInfoItem(f.label, data[f.key])).join('');

    daysHtml += `
      <div class="day-block">
        <div class="day-head">
          <div class="day-name">${meta.name}<span>-feira ${meta.num}</span></div>
          <div class="atividade-pill ${pillClass}">${pillText}</div>
        </div>

        <div class="lesson-box">
          <div class="k">Tema da Lição</div>
          <div class="v">${esc(data.temaLicao) || '—'}</div>
        </div>
        <div class="lesson-box">
          <div class="k">Número da Lição</div>
          <div class="v">${esc(data.numeroLicao) || '—'}</div>
        </div>
        <div class="lesson-box">
          <div class="k">Propósito da Lição</div>
          <div class="v">${esc(data.proposito) || '—'}</div>
        </div>
        <div class="lesson-box">
          <div class="k">Tipo de Lição</div>
          <div class="v">${esc(data.tipoLicao) || '—'}</div>
        </div>
        <div class="lesson-box">
          <div class="k">Designação de Estudo</div>
          <div class="v">${esc(data.designacaoEstudo) || '—'}</div>
        </div>
        <div class="lesson-box">
          <div class="k">Tarefas dos Alunos</div>
          <div class="v">${esc(data.tarefas) || '—'}</div>

        <div class="agenda-label">Agenda da Aula</div>
        <div class="agenda-num-list">${agendaNumbered}</div>

        <div class="agenda-label agenda-label-info">Informações da Agenda</div>
        ${agendaInfo}

  });

      <h1>Infoaula Semanal do Seminário</h1>
      <p class="sub1">${esc(state.tituloClasse)}</p>
      <p class="sub2">${esc(state.tituloEstaca)}</p>
    </div>
    <div class="poster-week">Semana: ${esc(state.semanaPeriodo)}</div>

function updatePreview(){
  renderPoster(collectAll());
}

function attachLiveListeners(){
  document.getElementById('tituloClasse').addEventListener('input', updatePreview);
  document.getElementById('tituloEstaca').addEventListener('input', updatePreview);
  document.getElementById('semanaInicio').addEventListener('input', updatePreview);
  document.getElementById('semanaFim').addEventListener('input', updatePreview);

  DAYS.forEach(day=>{
    document.getElementById(fieldId(day.key,'semAula')).addEventListener('change', (e)=>{
      const container = document.getElementById('container_'+day.key);
      container.classList.toggle('disabled-fields', e.target.checked);
      updatePreview();
    });
    const container = document.getElementById('container_'+day.key);
    container.addEventListener('input', updatePreview);
    container.addEventListener('change', updatePreview);
  });
}

function init(){
  buildTabs();
  const dayForms = document.getElementById('dayForms');
  DAYS.forEach(d=> dayForms.appendChild(buildDayForm(d)));
  attachLiveListeners();
  updatePreview();
}
init();

let lastCanvas = null;

async function generateCanvas(){
  const poster = document.getElementById('poster');

  // garante que as fontes (Lora/Inter) já carregaram antes de capturar,
  // evitando texto borrado ou com fonte substituta
  if(document.fonts && document.fonts.ready){
    try{ await document.fonts.ready; }catch(e){}
  }
  await new Promise(r=>setTimeout(r, 60));

  const rect = poster.getBoundingClientRect();

  const canvas = await html2canvas(poster, {
    scale: 4,                 // alta resolução: 4x o tamanho exibido
    backgroundColor: '#F7F3E9',
    useCORS: true,
    logging: false,
    imageTimeout: 15000,
    width: poster.scrollWidth,
    height: poster.scrollHeight,
    windowWidth: poster.scrollWidth,
    windowHeight: poster.scrollHeight
  });
  lastCanvas = canvas;
  return canvas;
}

document.getElementById('generateBtn').addEventListener('click', async ()=>{
  updatePreview();
  const btn = document.getElementById('generateBtn');
  btn.textContent = 'Gerando...';
  btn.disabled = true;
  await new Promise(r=>setTimeout(r, 50));
  await generateCanvas();
  btn.textContent = 'Gerar imagem';
  btn.disabled = false;
  document.querySelector('.preview-wrap').scrollIntoView({behavior:'smooth', block:'start'});
});

document.getElementById('downloadBtn').addEventListener('click', async ()=>{
  const canvas = lastCanvas || await generateCanvas();
  const link = document.createElement('a');
  link.download = 'infoaula-semanal.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});

document.getElementById('shareBtn').addEventListener('click', async ()=>{
  const canvas = lastCanvas || await generateCanvas();
  canvas.toBlob(async (blob)=>{
    const file = new File([blob], 'infoaula-semanal.png', {type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{
        await navigator.share({
          files:[file],
          title:'Infoaula Semanal do Seminário',
          text:'Infoaula Semanal do Seminário'
        });
      }catch(err){
        console.log('Compartilhamento cancelado', err);
      }
    } else {
      const link = document.createElement('a');
      link.download = 'infoaula-semanal.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
      alert('Seu navegador não permite compartilhar diretamente. A imagem foi baixada — agora é só anexá-la na conversa do WhatsApp.');
    }
  }, 'image/png');
});
</script>
